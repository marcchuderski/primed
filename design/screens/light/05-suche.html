<!doctype html>
<html lang="de">
<head>

<style>
body{margin:0}
</style>

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E2721" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input id="pm-search2" type="text" value="Skyr" style="border: none; outline: none; background: transparent; flex-grow: 1; min-width: 0; font: 600 16px 'Inter', system-ui, sans-serif; color: #2E2721">
</label>
<button aria-label="Barcode scannen" style="width: 52px; height: 52px; border-radius: 16px; border: none; background: #F2622E; color: #2E2721; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg>

</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6A5E52">Deine Bibliothek</div>
<div style="padding: 14px 16px; border-radius: 18px; border: 1px dashed rgba(46,39,33,0.2); font-size: 14px; color: #6A5E52">Noch nichts mit „Skyr“ gespeichert.</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6A5E52">Online-Treffer</div>
<div style="font-size: 12px; color: #6A5E52">Open Food Facts</div>
</div>
<button style="text-align: left; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 18px; border: 2px solid #F2622E; background: #F5EEE4; color: #2E2721; font-family: 'Inter', system-ui, sans-serif">
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">[Marke] Skyr Natur · 450 g</span><span style="font-size: 13px; color: #6A5E52; font-variant-numeric: tabular-nums">63 kcal · <span style="color: #A8410F; font-weight: 600">11 g P</span> · pro 100 g</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<button style="text-align: left; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 18px; border: none; background: #F5EEE4; color: #2E2721; font-family: 'Inter', system-ui, sans-serif">
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">[Marke] Skyr Vanille · 450 g</span><span style="font-size: 13px; color: #6A5E52; font-variant-numeric: tabular-nums">[kcal] · [P] · pro 100 g</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6A5E52">Richtwerte · unverpackt</div>
<button style="text-align: left; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 18px; border: none; background: #F5EEE4; color: #2E2721; font-family: 'Inter', system-ui, sans-serif">
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">Skyr natur <span style="font-size: 12px; font-weight: 600; color: #6A5E52; padding: 2px 8px; border-radius: 999px; background: #ECE3D6">Richtwert</span></span><span style="font-size: 13px; color: #6A5E52; font-variant-numeric: tabular-nums">[kcal] · [P] · pro 100 g</span></span>

</button>

<div style="flex-grow: 1"></div>

<div style="margin: 0 -20px; padding: 14px 20px 30px; background: #F5EEE4; border-top: 1px solid rgba(46,39,33,0.08); display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; color: #6A5E52; text-align: center">Nicht dabei?</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 52px; border-radius: 16px; border: none; background: #F2622E; color: #2E2721; font: 600 15px 'Inter', system-ui, sans-serif">Barcode scannen</button>
<button style="height: 52px; border-radius: 16px; border: 1px solid rgba(46,39,33,0.16); background: #F5EEE4; color: #2E2721; font: 600 15px 'Inter', system-ui, sans-serif">Neu anlegen</button>
</div>
</div>
</div>
</div>
