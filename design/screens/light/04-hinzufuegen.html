<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg>

<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 12px 12px 16px; border-radius: 18px; background: #F5EEE4">

<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 12px 12px 16px; border-radius: 18px; background: #F5EEE4">
