<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primed · 01-loading · light</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Inter:wght@400;500&amp;display=swap">
<style>
body{margin:0}
@keyframes pmFill{0%{stroke-dashoffset:100}70%{stroke-dashoffset:28}100%{stroke-dashoffset:28}}
@keyframes pmRise{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
.pm-arc{animation:pmFill 1.8s cubic-bezier(.2,.8,.2,1) infinite}
.pm-word{animation:pmRise .8s ease-out both .3s}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0;background:#d8d2c8}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ECE3D6; color: #2E2721; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; position: relative">
<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Primed lädt">

<circle cx="66" cy="48" r="26" fill="none" stroke="rgba(46,39,33,0.12)" stroke-width="18"></circle>
<circle class="pm-arc" cx="66" cy="48" r="26" fill="none" stroke="#F2622E" stroke-width="18" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="28" transform="rotate(-90 66 48)"></circle>
<rect x="26" y="20" width="18" height="84" rx="9" fill="#2E2721"></rect></svg>
<div class="pm-word" style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.045em"><span style="color: #F2622E">p</span>rimed</div>
<div style="position: absolute; bottom: 56px; font-size: 14px; color: #6A5E52">Bereit für heute.</div>
</div>
</body>
</html>
