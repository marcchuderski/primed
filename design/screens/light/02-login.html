<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primed · 02-login · light</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2E2721}a:hover{color:#6A5E52}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0;background:#d8d2c8}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 72px 28px 40px; background: #ECE3D6; color: #2E2721; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="40" height="40" viewBox="0 0 120 120" aria-hidden="true">

<circle cx="66" cy="48" r="26" fill="none" stroke="rgba(46,39,33,0.12)" stroke-width="18"></circle>
<circle cx="66" cy="48" r="26" fill="none" stroke="#F2622E" stroke-width="18" stroke-linecap="round" pathLength="100" stroke-dasharray="72 100" transform="rotate(-90 66 48)"></circle>
<rect x="26" y="20" width="18" height="84" rx="9" fill="#2E2721"></rect></svg>
<div style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.045em"><span style="color: #F2622E">p</span>rimed</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.02; letter-spacing: -0.03em">Willkommen zurück.</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #6A5E52">Melde dich an und mach da weiter, wo du aufgehört hast.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pm-user" style="font-size: 14px; font-weight: 600">Username</label>
<input id="pm-user" type="text" placeholder="[username]" style="height: 56px; box-sizing: border-box; padding: 0 18px; border-radius: 16px; border: 1px solid rgba(46,39,33,0.14); background: #F5EEE4; color: #2E2721; font: 500 16px 'Inter', system-ui, sans-serif">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pm-pass" style="font-size: 14px; font-weight: 600">Passwort</label>
<input id="pm-pass" type="password" value="passwort1" style="height: 56px; box-sizing: border-box; padding: 0 18px; border-radius: 16px; border: 2px solid #2E2721; background: #F5EEE4; color: #2E2721; font: 500 16px 'Inter', system-ui, sans-serif">
</div>
</div>

<div style="flex-grow: 1"></div>

<div style="display: flex; flex-direction: column; gap: 16px; align-items: center">
<button style="width: 100%; height: 58px; border-radius: 18px; border: none; background: #F2622E; color: #2E2721; font: 600 17px 'Inter', system-ui, sans-serif">Einloggen</button>
<a href="#" style="font-size: 14px; color: #6A5E52">Passwort vergessen?</a>
</div>
</div>
</body>
</html>
