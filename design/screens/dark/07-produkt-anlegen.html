<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}

<body>
<div style="width: 390px; height: 960px; box-sizing: border-box; background: #17191D; color: #E8E3DB; font-family: 'Inter', system-ui, sans-serif; position: relative; overflow: hidden; ">
<div style="padding: 44px 20px 30px; display: flex; flex-direction: column; gap: 16px; height: 100%; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 12px"><button aria-label="Zurück" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; border: none; background: #2B2F36; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button><h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.03em">Neues Produkt</h1></div>
<label for="np-name" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; border-radius: 16px; background: #1F2227"><span style="font-size: 12px; font-weight: 600; color: #9F9A92">Name</span><input id="np-name" type="text" value="Erdnussbutter" style="border: none; outline: none; background: transparent; padding: 0; font: 700 18px 'Inter', system-ui, sans-serif; color: #E8E3DB"></label>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px"><button style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: rgba(242,122,75,0.2); color: #F59A73; font: 700 13px 'Inter', system-ui, sans-serif">Snacks</button><button style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #1F2227; color: #E8E3DB; font: 600 13px 'Inter', system-ui, sans-serif">Milchprodukte</button><button style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #1F2227; color: #E8E3DB; font: 600 13px 'Inter', system-ui, sans-serif">Brot</button><button style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #1F2227; color: #E8E3DB; font: 600 13px 'Inter', system-ui, sans-serif">Obst &amp; Gemüse</button><button style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #1F2227; color: #E8E3DB; font: 600 13px 'Inter', system-ui, sans-serif">Getränke</button></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9F9A92">Nährwerte angeben pro</div><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #2B2F36"><button aria-pressed="true" style="height: 40px; border-radius: 12px; border: none; background: #1F2227; color: #E8E3DB; font: 700 14px 'Inter', system-ui, sans-serif; box-shadow: 0 1px 2px rgba(0,0,0,0.1)">100 g</button><button aria-pressed="false" style="height: 40px; border-radius: 12px; border: none; background: transparent; color: #9F9A92; font: 600 14px 'Inter', system-ui, sans-serif">100 ml</button><button aria-pressed="false" style="height: 40px; border-radius: 12px; border: none; background: transparent; color: #9F9A92; font: 600 14px 'Inter', system-ui, sans-serif">Stück</button></div><div style="font-size: 13px; color: #9F9A92">So, wie es auf der Packung steht.</div></div>
<div style="border-radius: 22px; background: #1F2227; display: flex; flex-direction: column"><div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid rgba(232,227,219,0.07);">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: #E8E3DB">Kalorien</span><span style="font-size: 12px; color: #9F9A92">±20 kcal</span></div>
<div style="display: flex; align-items: center; gap: 4px"><button aria-label="Kalorien verringern" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #17191D; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><button style="min-width: 78px; height: 40px; border: none; background: transparent; color: #E8E3DB; font: 700 18px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">600<span style="font-size: 13px; font-weight: 500; color: #9F9A92"> kcal</span></button><button aria-label="Kalorien erhöhen" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #2B2F36; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div><div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid rgba(232,227,219,0.07);">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: #F59A73">Protein</span><span style="font-size: 12px; color: #9F9A92">±1 g</span></div>
<div style="display: flex; align-items: center; gap: 4px"><button aria-label="Protein verringern" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #17191D; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><button style="min-width: 78px; height: 40px; border: none; background: transparent; color: #E8E3DB; font: 700 18px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">25<span style="font-size: 13px; font-weight: 500; color: #9F9A92"> g</span></button><button aria-label="Protein erhöhen" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #2B2F36; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div><div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid rgba(232,227,219,0.07);">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: #E8E3DB">Kohlenhydrate</span><span style="font-size: 12px; color: #9F9A92">±1 g</span></div>
<div style="display: flex; align-items: center; gap: 4px"><button aria-label="Kohlenhydrate verringern" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #17191D; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><button style="min-width: 78px; height: 40px; border: none; background: transparent; color: #E8E3DB; font: 700 18px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">12<span style="font-size: 13px; font-weight: 500; color: #9F9A92"> g</span></button><button aria-label="Kohlenhydrate erhöhen" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #2B2F36; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div><div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid rgba(232,227,219,0.07);">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: #E8E3DB">davon Zucker</span><span style="font-size: 12px; color: #9F9A92">±1 g</span></div>
<div style="display: flex; align-items: center; gap: 4px"><button aria-label="davon Zucker verringern" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #17191D; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><button style="min-width: 78px; height: 40px; border: none; background: transparent; color: #E8E3DB; font: 700 18px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">6<span style="font-size: 13px; font-weight: 500; color: #9F9A92"> g</span></button><button aria-label="davon Zucker erhöhen" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #2B2F36; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div><div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; ">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: #E8E3DB">Fett</span><span style="font-size: 12px; color: #9F9A92">±0,5 g</span></div>
<div style="display: flex; align-items: center; gap: 4px"><button aria-label="Fett verringern" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #17191D; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><button style="min-width: 78px; height: 40px; border: none; background: transparent; color: #E8E3DB; font: 700 18px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">50<span style="font-size: 13px; font-weight: 500; color: #9F9A92"> g</span></button><button aria-label="Fett erhöhen" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #2B2F36; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9F9A92">Packung</div>
<div style="border-radius: 22px; background: #1F2227"><div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; ">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: #E8E3DB">Packungsgröße</span><span style="font-size: 12px; color: #9F9A92">±50 g</span></div>
<div style="display: flex; align-items: center; gap: 4px"><button aria-label="Packungsgröße verringern" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #17191D; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><button style="min-width: 78px; height: 40px; border: none; background: transparent; color: #E8E3DB; font: 700 18px 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums">350<span style="font-size: 13px; font-weight: 500; color: #9F9A92"> g</span></button><button aria-label="Packungsgröße erhöhen" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; border: none; background: #2B2F36; color: #E8E3DB; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div></div></div>
<div style="flex-grow: 1"></div>
<button style="width: 100%; height: 58px; flex-shrink: 0; border-radius: 18px; border: none; background: #F27A4B; color: #17191D; font: 600 17px 'Inter', system-ui, sans-serif; ">Speichern &amp; Menge wählen</button>
